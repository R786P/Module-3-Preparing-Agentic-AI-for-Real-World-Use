<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Project Analyzer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f7f9fb; }
        .result-box { white-space: pre-wrap; word-wrap: break-word; min-height: 150px; }
    </style>
</head>
<body class="p-4 sm:p-8">
    <div class="max-w-3xl mx-auto">
        <header class="text-center mb-10">
            <h1 class="text-4xl font-extrabold text-indigo-700 mb-2">AI Project Analyzer</h1>
            <p class="text-gray-600">Get actionable suggestions to improve your GitHub project</p>
        </header>

        <div class="bg-white p-6 sm:p-10 rounded-xl shadow-2xl border border-gray-100">
            <!-- IMPORTANT: name="repo_url" must match FastAPI Form parameter -->
            <form action="/analyze" method="POST" class="space-y-6">
                <div>
                    <label for="repo_url" class="block text-sm font-medium text-gray-700 mb-2">
                        GitHub Repository URL
                    </label>
                    <input 
                        type="url" 
                        id="repo_url"
                        name="repo_url"
                        placeholder="https://github.com/username/repository"
                        value="{{ repo_url or '' }}"
                        required
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
                    >
                </div>
                <button 
                    type="submit"
                    class="w-full bg-indigo-600 text-white py-3 px-6 rounded-lg font-semibold hover:bg-indigo-700 transition-colors"
                >
                    🔍 Analyze Repository
                </button>
            </form>

            {% if error %}
            <div class="mt-6 p-4 bg-red-50 border-l-4 border-red-500 text-red-700 rounded">
                {{ error }}
            </div>
            {% endif %}

            {% if result %}
            <div class="mt-8">
                <h2 class="text-xl font-bold text-gray-800 mb-4">📊 Analysis Results</h2>
                <div class="result-box p-4 bg-gray-50 border border-gray-200 rounded-lg text-gray-700">
                    {{ result }}
                </div>
            </div>
            {% endif %}
        </div>
    </div>
</body>
</html>
